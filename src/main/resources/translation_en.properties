libs.grid.actions.button.delete.title = Delete library
libs.delete.dialog.text = Its file is deleted from the server for good, and the other libraries are loaded again. A script which uses its classes fails from then on.
libs.delete.dialog.commands.text = Its file is deleted from the server for good, and the other libraries are loaded again. The commands it brings are not known anymore from then on, so a workflow which uses one of them fails at that command: %s.
libs.delete.done.message = Library '%s' was deleted.
libs.delete.failed.message = Library '%s' could not be deleted: %s
libs.guide.intro = The Java libraries (JAR files) which extend what the java and groovy commands of a workflow can use, or bring commands of their own.
libs.guide.legend.path.title = Library path
libs.guide.legend.path.text = Where the JAR file is kept on the server. Click it to download the file.
libs.guide.legend.loaded.title = Loaded
libs.guide.legend.loaded.text = The classes of the library can be used by workflows.
libs.guide.legend.not-loaded.title = Not loaded
libs.guide.legend.not-loaded.text = The file was found, but it could not be loaded. The application log says why.
libs.guide.legend.command.title = Command
libs.guide.legend.command.text = Under the path of a library which brings commands of its own, one badge for each. The name on the badge is what a workflow definition writes as the <code>class</code> of a command.
libs.guide.legend.checksum.title = Checksum
libs.guide.legend.checksum.text = The first characters of the SHA-256 checksum of the file. Click to copy the whole of it, and compare it with the checksum of the JAR you built: <code>sha256sum my-lib.jar</code>, or <code>certutil -hashfile my-lib.jar SHA256</code> on Windows.
libs.guide.legend.delete.title = Delete
libs.guide.legend.delete.text = Asks for confirmation first, then deletes the file from the server and loads the other libraries again.
libs.guide.legend.upload.title = Upload
libs.guide.legend.upload.text = In the header. Sends a <code>.jar</code> file to the libraries directory of the server.
libs.guide.steps.title = Add a library
libs.guide.steps.1.title = Upload it
libs.guide.steps.1.text = Click the upload button in the header and choose a <code>.jar</code> file, one at a time.
libs.guide.steps.2.title = Have it loaded
libs.guide.steps.2.text = Libraries are loaded when the application starts, so the new one is listed after a restart - or right after the upload, with <code>reload-after-upload: true</code> in the application config.
libs.guide.steps.3.title = Use it
libs.guide.steps.3.text = Call its classes from the script of a <code>java</code> or <code>groovy</code> command. If it brings commands, use them like any other command: the editor completes their names and their inputs.
libs.guide.notes.directory.title = Where libraries are kept
libs.guide.notes.directory.text = Every <code>.jar</code> file of the directory named by <code>my-workflows.config.library.base-directory</code> is a library, the ones copied there by hand included.
libs.guide.notes.commands.title = A library can bring commands
libs.guide.notes.commands.text = A class of the library which extends <code>AbstractCommand</code> becomes a command once it is named in the file <code>META-INF/services/org.myworkflows.domain.command.AbstractCommand</code> of the JAR. A command which cannot be used - it takes the name of another one, or its class does not load - is left out, and the application log says why.
libs.guide.notes.replace.title = The same name replaces the file
libs.guide.notes.replace.text = A file uploaded under the name of a library that is already there overwrites it.
libs.guide.notes.remove.title = Deleting a library reloads the other ones
libs.guide.notes.remove.text = An admin deletes a library with the button of its row. Its file is removed from the directory and every other library is loaded again at once, whatever <code>reload-after-upload</code> says: a file which is in use cannot be removed. A workflow definition which uses a command of the deleted library is kept as it was written, and fails at that command when it is run.
libs.guide.notes.facts.title = Size, date and checksum are those of what was loaded
libs.guide.notes.facts.text = They are read from the file when the libraries are loaded. A file uploaded over a library which is already there shows up with its own size, date and checksum once the libraries are loaded again.

