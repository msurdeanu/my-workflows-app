workflow-development.script-editor.lens.groovy = ✎ Open in Groovy editor
workflow-development.script-editor.not-found.message = Place the cursor inside a java.script or groovy.script input to edit its script. The workflow definition must be a valid YAML document.
workflow-development.script-editor.not-saved.message = The script could not be written back into the workflow definition. Your changes are still in the script editor.
workflow-development.guide.intro = Write the script of a workflow definition, run it with the parameters you choose and see what it prints.
workflow-development.guide.legend.title = What you see on this page
workflow-development.guide.legend.unsaved.title = Unsaved changes
workflow-development.guide.legend.unsaved.text = In the header while the editor differs from the saved definition. Shown to an admin, once a definition is chosen.
workflow-development.guide.legend.status.title = Run status
workflow-development.guide.legend.status.text = Above the editor once a run was started: yellow while the workflow runs, blue while it is paused, green when it passed, red when it failed or when the script is not a valid workflow. It holds the buttons which tell a paused run how to go on and which start a run that is over again, and one which copies the id of the run.
workflow-development.guide.legend.lens.title = Script editor
workflow-development.guide.legend.lens.text = Above every <code>java.script</code> and <code>groovy.script</code> input. Opens the script in an editor of its own, with Java or Groovy highlighting.
workflow-development.guide.legend.run.title = Run
workflow-development.guide.legend.run.text = Runs the script as it is in the editor, saved or not, with the parameters listed under <em>Workflow Parameters</em>.
workflow-development.guide.legend.debug.title = Debug
workflow-development.guide.legend.debug.text = Runs the script like <em>Run</em>, but pauses before every command which has a breakpoint - or before the first command, when there is no breakpoint. <em>Run</em> pauses nowhere, whatever the breakpoints.
workflow-development.guide.legend.breakpoint.title = Breakpoint
workflow-development.guide.legend.breakpoint.text = Next to the line numbers of the editor. Click there, on any line of a command, to set the breakpoint of that command, and click again to remove it. Breakpoints follow their command while you edit and are not saved with the definition.
workflow-development.guide.legend.save.title = Save
workflow-development.guide.legend.save.text = Writes the script into the chosen definition. Available only while there are unsaved changes.
workflow-development.guide.legend.save-copy.title = Save as copy
workflow-development.guide.legend.save-copy.text = Saves the editor as a new definition, under a name you choose, and goes on with it. The chosen definition stays as it was saved.
workflow-development.guide.legend.share.title = Share
workflow-development.guide.legend.share.text = Opens a dialog with a link to the chosen definition. The link can carry the parameters and can be made read-only.
workflow-development.guide.steps.title = Develop a workflow
workflow-development.guide.steps.1.title = Choose a definition
workflow-development.guide.steps.1.text = Pick it from the list in the header and its script opens in the editor. Definitions are created under <em>Workflow Definitions</em>.
workflow-development.guide.steps.2.title = Write the script
workflow-development.guide.steps.2.text = A workflow is a YAML document that lists its commands. The editor completes keywords, command classes and inputs as you type; type <kbd>input</kbd>, <kbd>assert</kbd> or <kbd>output</kbd> for a snippet, or the class of a command - <kbd>sleep</kbd>, <kbd>httpRequest</kbd> - for a snippet of that command with its required inputs. Every command is described under Documentation, on the Command reference page.
workflow-development.guide.steps.3.title = Add the parameters
workflow-development.guide.steps.3.text = Under <em>Workflow Parameters</em>, type a name in the field at the top right of the grid and press <kbd>Enter</kbd>, then choose the type and the value.
workflow-development.guide.steps.4.title = Run it
workflow-development.guide.steps.4.text = Click <em>Run</em>. The status above the editor follows the run and <em>Workflow Prints</em> lists every value it printed. Click <em>Debug</em> instead to go through the commands one by one: <em>Variables</em> then takes the place of the parameters until the next <em>Run</em>.
workflow-development.guide.steps.5.title = Save and share
workflow-development.guide.steps.5.text = <em>Save</em> keeps the script in the definition, for the templates that run it. <em>Share</em> hands the definition to somebody else as a link.
workflow-development.guide.notes.shortcuts.title = Keyboard shortcuts
workflow-development.guide.notes.shortcuts.text = Reformatting and the script editor need the cursor in the editor. More shortcuts are named, one at a time, under the editor.
workflow-development.guide.notes.shortcuts.focus = focus the editor
workflow-development.guide.notes.shortcuts.run = run
workflow-development.guide.notes.shortcuts.debug = debug
workflow-development.guide.notes.shortcuts.save = save
workflow-development.guide.notes.shortcuts.share = share
workflow-development.guide.notes.shortcuts.reformat = reformat
workflow-development.guide.notes.shortcuts.script = script editor
workflow-development.guide.notes.debugging.title = Debugging step by step
workflow-development.guide.notes.debugging.text = While a run is paused, the editor marks the command it stands before and <em>Variables</em> lists everything it holds, with what the last step added or changed on top. <em>Variables</em> takes the place of <em>Workflow Parameters</em> from <em>Debug</em> until the next <em>Run</em>, as the parameters are among what the run holds: their tab, next to it, is for the next run. <em>Step</em> runs that command and pauses again, <em>Continue</em> runs to the next breakpoint and <em>Stop</em> ends the run, whose final commands still run. Each of them reads the script from the editor again, so a command can be changed before it runs. <em>From cursor</em> carries on from the command the cursor is in, with the variables as they are: the commands in between are skipped, or run again. A run which is over starts again the same way, and <em>From command N</em> starts it again from the command it did not get past. A run pauses only before a command listed under <code>commands</code>, and for an hour at most.
workflow-development.guide.notes.debugging.step = step
workflow-development.guide.notes.debugging.continue = continue
workflow-development.guide.notes.debugging.from-cursor = from cursor
workflow-development.guide.notes.read-only.title = Read-only links
workflow-development.guide.notes.read-only.text = Whoever opens a read-only link can run the workflow, but can neither change its definition or its parameters, nor debug it. Instead of the editor, the link shows the pipeline of the workflow: its commands in the order they run, each with a few words on what it does, and - once a run was started - how far the run got. The definition itself is not shown.
workflow-development.guide.notes.runs.title = Where the runs go
workflow-development.guide.notes.runs.text = A run started here is listed under <em>Workflow Runs</em>, without a template. If it fails, you can replay it from there.

