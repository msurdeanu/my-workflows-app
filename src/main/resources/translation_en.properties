editor.tip.0 = <strong>Tip:</strong> Press <kbd>F1</kbd> to open command palette
editor.tip.1 = <strong>Tip:</strong> Press <kbd>Tab</kbd> to indent current line
editor.tip.2 = <strong>Tip:</strong> Press <kbd>Shift</kbd> + <kbd>Tab</kbd> to outdent current line
editor.tip.3 = <strong>Tip:</strong> Press <kbd>Ctrl</kbd> + <kbd>]</kbd> to indent block
editor.tip.4 = <strong>Tip:</strong> Press <kbd>Ctrl</kbd> + <kbd>[</kbd> to outdent block
editor.tip.5 = <strong>Tip:</strong> Press <kbd>Ctrl</kbd> + <kbd>A</kbd> to select entire text
editor.tip.6 = <strong>Tip:</strong> Press <kbd>Ctrl</kbd> + <kbd>D</kbd> to remove current line
editor.tip.7 = <strong>Tip:</strong> Press <kbd>Ctrl</kbd> + <kbd>F</kbd> to search text
editor.tip.8 = <strong>Tip:</strong> Press <kbd>Ctrl</kbd> + <kbd>H</kbd> to replace text
editor.tip.9 = <strong>Tip:</strong> Press <kbd>Ctrl</kbd> + <kbd>U</kbd> to make current word uppercase
editor.tip.10 = <strong>Tip:</strong> Press <kbd>Ctrl</kbd> + <kbd>Alt</kbd> + <kbd>U</kbd> to make current word lowercase
editor.tip.11 = <strong>Tip:</strong> Press <kbd>Ctrl</kbd> + <kbd>/</kbd> to comment / uncomment the current line
editor.tip.12 = <strong>Tip:</strong> Press <kbd>Ctrl</kbd> + <kbd>L</kbd> to go to a specific line
editor.tip.13 = <strong>Tip:</strong> Press <kbd>Ctrl</kbd> + <kbd>Alt</kbd> + <kbd>F</kbd> to reformat the existing code
editor.tip.14 = <strong>Tip:</strong> Press <kbd>Ctrl</kbd> + <kbd>Alt</kbd> + <kbd>W</kbd> to wrap / unwrap the existing code
editor.tip.15 = <strong>Tip:</strong> More key bindings are available <a href="https://github.com/ajaxorg/ace/wiki/default-keyboard-shortcuts" target="_blank">here</a>
editor.tip.16 = <strong>Tip:</strong> Type <kbd>input</kbd> and choose the input snippet to quickly create an input expression block
editor.tip.17 = <strong>Tip:</strong> Type <kbd>assert</kbd> and choose the assertion snippet to quickly create an assertion expression block
editor.tip.18 = <strong>Tip:</strong> Type <kbd>output</kbd> and choose the output snippet to quickly create an output expression block
editor.tip.19 = <strong>Tip:</strong> Press <kbd>Tab</kbd> to navigate between snippet placeholders to complete them faster
editor.tip.20 = <strong>Tip:</strong> Press <kbd>Ctrl</kbd> + <kbd>Alt</kbd> + <kbd>R</kbd> to run the workflow
editor.tip.21 = <strong>Tip:</strong> Press <kbd>Ctrl</kbd> + <kbd>Alt</kbd> + <kbd>U</kbd> to save the workflow definition
editor.tip.22 = <strong>Tip:</strong> Press <kbd>Ctrl</kbd> + <kbd>Alt</kbd> + <kbd>S</kbd> to share the workflow
