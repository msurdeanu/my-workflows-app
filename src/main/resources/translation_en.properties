transfer.guide.intro = Move workflows from one instance to another as a file: export them here, import the file there.
transfer.guide.legend.title = What you see on the page
transfer.guide.legend.needed.title = Needed
transfer.guide.legend.needed.text = When exporting, an item which something you picked cannot go without: a definition or a parameter of a picked template, a placeholder an exported definition names. It is exported with what needs it, which is named next to it.
transfer.guide.legend.left-out.title = Value left out
transfer.guide.legend.left-out.text = The item is written to the file without its value, as it is taken for a secret.
transfer.guide.legend.new.title = New
transfer.guide.legend.new.text = When importing, nothing here goes by the name of the item. It is created, unless you skip it.
transfer.guide.legend.different.title = Different
transfer.guide.legend.different.text = An item of this name is here, and it is not what the file has. Either the file overwrites it or you keep yours.
transfer.guide.legend.same.title = Same
transfer.guide.legend.same.text = What is here is what the file has. Nothing is done with it.
transfer.guide.steps.title = Move workflows to another instance
transfer.guide.steps.1.title = Pick what to move
transfer.guide.steps.1.text = On <em>Export</em>, tick the templates you want. Their definitions, their parameters and the placeholders of those definitions are ticked with them.
transfer.guide.steps.2.title = Export
transfer.guide.steps.2.text = Choose between one YAML file and a zip archive, then click <em>Export</em>. Your browser downloads the file.
transfer.guide.steps.3.title = Choose the file on the other instance
transfer.guide.steps.3.text = There, on <em>Import</em>, choose the file. Every item is compared with what that instance holds, and nothing is changed yet.
transfer.guide.steps.4.title = Decide and import
transfer.guide.steps.4.text = Decide for each item which is new or different, type the values the file left out, then click <em>Import</em>.
transfer.guide.notes.names.title = Items are matched by name
transfer.guide.notes.names.text = An id means nothing on another instance, so a file names everything. Two definitions - or two templates - which go by the same name cannot be told apart: such a pair is refused by an export and by an import. Rename one of them first.
transfer.guide.notes.own.title = A parameter of one template travels with it
transfer.guide.notes.own.text = A parameter named <code>timeout.42</code> is meant for template #42. It is exported with that template only, as <code>timeout</code>, and gets the id of the template it is imported into.
transfer.guide.notes.secrets.title = Passwords stay behind
transfer.guide.notes.secrets.text = Unless you ask for them, the value of a <em>Password</em> parameter and of anything whose name contains <code>password</code> is not written to the file. An item which is already on the other instance keeps its value there; for a new one, the import asks for it.
transfer.guide.notes.paused.title = New templates arrive paused
transfer.guide.notes.paused.text = A template an import creates is unticked, whatever it was where it comes from, unless you untick <em>Keep the new templates paused</em>. A template which was already there keeps its activation.
transfer.guide.notes.whole.title = All or nothing
transfer.guide.notes.whole.text = An import saves everything you chose or nothing at all. When what is here changes while you decide, nothing is saved and the file is compared again.
transfer.guide.notes.commands.title = Commands of a library
transfer.guide.notes.commands.text = A definition which uses a command of a library the other instance does not have is imported as it is, and fails at that command when it runs. Upload the library under <em>Libraries</em>.

