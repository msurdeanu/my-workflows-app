workflow-pipeline.command.httpRequest.label = HTTP request
workflow-pipeline.command.httpRequest.text = Sends an HTTP request.
workflow-pipeline.command.httpRequest.detail = Calls
workflow-pipeline.command.loop.label = Loop
workflow-pipeline.command.loop.text = Runs the commands below once for every item of a list.
workflow-pipeline.command.nothing.label = Inputs only
workflow-pipeline.command.nothing.text = Runs nothing: it only sets its inputs.
workflow-pipeline.command.print.label = Print
workflow-pipeline.command.print.text = Shows values under Workflow Prints.
workflow-pipeline.command.print.detail = Shows under Workflow Prints:
workflow-pipeline.command.sleep.label = Sleep
workflow-pipeline.command.sleep.text = Waits before the next command.
