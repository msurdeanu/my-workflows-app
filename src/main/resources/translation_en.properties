workflow-reports.delete.done.message = Report '%s' was deleted.
workflow-reports.not-found.message = There is no report %s. It was deleted, maybe together with its run.
workflow-reports.guide.intro = The reports written by the report command of a run: a Markdown or HTML text, shown as it reads next to the list.
workflow-reports.guide.legend.run.title = Run
workflow-reports.guide.legend.run.text = The run which wrote the report, by the first eight characters of its id. Click it to open the run on the runs page.
workflow-reports.guide.legend.template.title = Template
workflow-reports.guide.legend.template.text = The template of that run; click it to open the template. <em>N/A</em> marks a run that was not started from a template, or whose template was deleted.
workflow-reports.guide.legend.markdown.title = Markdown
workflow-reports.guide.legend.markdown.text = A report written in Markdown. Tables are understood, and so is the HTML written in between.
workflow-reports.guide.legend.html.title = HTML
workflow-reports.guide.legend.html.text = A report written as an HTML page, shown with its own styles.
workflow-reports.guide.legend.download.title = Download
workflow-reports.guide.legend.download.text = Saves the file of the report, as the run wrote it.
workflow-reports.guide.legend.link.title = Copy link
workflow-reports.guide.legend.link.text = Copies the address of this report, <code>workflow/reports/&lt;run id&gt;/&lt;file name&gt;</code>, which opens the page with the report on display.
workflow-reports.guide.legend.delete.title = Delete
workflow-reports.guide.legend.delete.text = Asks for confirmation first, then deletes the report and its file.
workflow-reports.guide.steps.title = Read a report
workflow-reports.guide.steps.1.title = Write it
workflow-reports.guide.steps.1.text = Add a <code>report</code> command to a workflow, with a <code>report.title</code> and a <code>report.content</code>, and run it.
workflow-reports.guide.steps.2.title = Find it
workflow-reports.guide.steps.2.text = In the header, choose a format or a template, or type a run id or a part of the title. The newest report comes first.
workflow-reports.guide.steps.3.title = Read it
workflow-reports.guide.steps.3.text = Click a row. <em>Rendered</em> shows the report as it reads, <em>Source</em> the text the run wrote.
workflow-reports.guide.notes.command.title = The report command
workflow-reports.guide.notes.command.text = <code>report.title</code> is the name of the file, so a character a file name cannot hold becomes <code>-</code>, and a second report of a run with the same title is <code>Title (2)</code>. <code>report.format</code> is <code>markdown</code>, the default, or <code>html</code>. Like any input, it stays in the run once it is set: a later <code>report</code> command which names no format writes the same one. The content is any text, so it can be built by a <code>groovy</code>, <code>java</code> or <code>spel</code> value from what the run holds. The command outputs the id of the report, <code>&lt;run id&gt;/&lt;file name&gt;</code>, which is how a mail can link to it.
workflow-reports.guide.notes.safety.title = A report cannot act on this page
workflow-reports.guide.notes.safety.text = A report is shown in a frame which runs no script and has no access to the page or to your session. A link inside it opens in a tab of its own. Downloaded, the file is saved, never opened by the browser.
workflow-reports.guide.notes.history.title = A report goes away with its run
workflow-reports.guide.notes.history.text = Deleting a run deletes its reports, and so does the setting <em>Workflow Run - Max size</em> when it trims the oldest runs. A report is at most as large as the setting <em>Report - Max size</em> allows.
workflow-reports.guide.notes.directory.title = Reports are files
workflow-reports.guide.notes.directory.text = Nothing about a report is kept but its file, in the directory named by <code>my-workflows.config.report.base-directory</code>, <code>reports</code> by default: a directory per run, named after its id, and a <code>.md</code> or <code>.html</code> file per report. Like the libraries, they are read when the application starts, so a file copied there by hand is listed after a restart.

workflow-templates.page.title = Workflow Templates
workflow-templates.filter.by-name.placeholder = Filter by name
workflow-templates.filter.chip.name = Name: %s
workflow-templates.filter.chip.id = Template #%s
workflow-templates.grid.name.column = Name
workflow-templates.grid.cron-expression.tooltip = The cron time is '%s'
workflow-templates.grid.actions.button.schedule.title = Run a workflow template immediately
workflow-templates.grid.actions.button.edit.title = Edit workflow template
workflow-templates.grid.actions.button.duplicate.title = Duplicate workflow template
workflow-templates.grid.actions.button.delete.title = Delete workflow template
workflow-templates.guide.intro = A workflow template runs one or more workflow definitions on a schedule, with the parameters you pick.
workflow-templates.guide.legend.activation.title = Activation
workflow-templates.guide.legend.activation.text = Ticked, the template runs whenever its cron expression fires. Unticked, it is paused: its cron is ignored, but it can still be run by hand.
workflow-templates.guide.legend.name.title = Name
workflow-templates.guide.legend.name.text = Click the name to show only this template. The chip that appears above the grid brings the full list back.
workflow-templates.guide.legend.cron.title = Cron expression
workflow-templates.guide.legend.cron.text = The template has a schedule. Hover the clock to read it.
workflow-templates.guide.legend.run.title = Run now
workflow-templates.guide.legend.run.text = Starts a run immediately, whatever the schedule says.
workflow-templates.guide.legend.edit.title = Edit
workflow-templates.guide.legend.edit.text = Rename the template and change its cron in place. <kbd>Enter</kbd> saves, <kbd>Esc</kbd> cancels.
workflow-templates.guide.legend.duplicate.title = Duplicate
workflow-templates.guide.legend.duplicate.text = Saves a copy of the template under another name: the same definitions, parameters and cron. The copy starts paused, and its parameters for one template only are copied for it.
workflow-templates.guide.legend.delete.title = Delete
workflow-templates.guide.legend.delete.text = Asks for confirmation first. Available only while the template is paused.
workflow-templates.guide.steps.title = Set up a template
workflow-templates.guide.steps.1.title = Create it
workflow-templates.guide.steps.1.text = Type a name in the field at the top right of the grid and press <kbd>Enter</kbd>.
workflow-templates.guide.steps.2.title = Choose what runs
workflow-templates.guide.steps.2.text = Click the row to open it, then drag workflow definitions from <em>Available</em> to <em>Selected</em>. They run in the listed order, as a single workflow run.
workflow-templates.guide.steps.3.title = Choose the parameters
workflow-templates.guide.steps.3.text = In the same row, drag over the workflow parameters every run should receive.
workflow-templates.guide.steps.4.title = Schedule it
workflow-templates.guide.steps.4.text = Click <em>Edit</em>, type a cron expression in the field next to the name and press <kbd>Enter</kbd>.
workflow-templates.guide.steps.5.title = Switch it on
workflow-templates.guide.steps.5.text = Tick the checkbox. Without a cron expression the template stays idle until you run it by hand.
workflow-templates.guide.notes.cron.title = A cron expression has six fields
workflow-templates.guide.notes.cron.text = <code>0 30 6 * * MON-FRI</code> runs every weekday at 06:30, in the time zone of the server.
workflow-templates.guide.notes.cron.second = second
workflow-templates.guide.notes.cron.minute = minute
workflow-templates.guide.notes.cron.hour = hour
workflow-templates.guide.notes.cron.day-of-month = day of month
workflow-templates.guide.notes.cron.month = month
workflow-templates.guide.notes.cron.day-of-week = day of week
workflow-templates.guide.notes.parameters.title = Parameters for one template only
workflow-templates.guide.notes.parameters.text = A parameter named <code>timeout.42</code> is meant for template #42 and reaches the workflow as <code>timeout</code>.
workflow-templates.guide.notes.runs.title = Where the runs go
workflow-templates.guide.notes.runs.text = Every run is listed under <em>Workflow Runs</em>. A run started by the cron belongs to no user, so it cannot be replayed.
workflow-templates.duplicate.definitions.label = Definitions
workflow-templates.duplicate.definitions.text = The same definitions, in the same order. They are not copied.
workflow-templates.duplicate.parameters.label = Parameters
workflow-templates.duplicate.parameters.text = The same parameters, shared with the original.
workflow-templates.duplicate.own-parameters.label = Own parameters
workflow-templates.duplicate.own-parameters.text = Meant for the original alone. A copy belongs to the new template, so changing one never changes the other.
workflow-templates.duplicate.own-parameters.new-name = %s.<new id>
workflow-templates.duplicate.own-parameters.checkbox = Copy them, with their values, for the new template
workflow-templates.duplicate.cron.label = Cron
workflow-templates.duplicate.cron.text = Copied.
workflow-templates.duplicate.paused.message = The copy starts paused, so it does not run next to the original. Tick it in the grid when it is ready.
workflow-templates.duplicate.success.message = The workflow template '%s' was created. It is paused.

workflow-definitions.page.title = Workflow Definitions
workflow-definitions.filter.by-name.placeholder = Filter by name
workflow-definitions.filter.chip.name = Name: %s
workflow-definitions.filter.chip.id = Definition #%s
workflow-definitions.grid.name.column = Name
workflow-definitions.grid.actions.button.edit.title = Edit workflow definition
workflow-definitions.grid.actions.button.duplicate.title = Duplicate workflow definition
workflow-definitions.grid.actions.button.delete.title = Delete workflow definition
workflow-definitions.guide.intro = A workflow definition is the YAML script of a workflow: the commands to run, in the order they are written.
workflow-definitions.guide.legend.name.title = Name
workflow-definitions.guide.legend.name.text = Click the name to open the definition on the development page, where its script is written and run.
workflow-definitions.guide.legend.edit.title = Edit
workflow-definitions.guide.legend.edit.text = Rename the definition in place. <kbd>Enter</kbd> saves, <kbd>Esc</kbd> cancels.
workflow-definitions.guide.legend.duplicate.title = Duplicate
workflow-definitions.guide.legend.duplicate.text = Saves a copy of the definition under another name. The workflow templates go on running the original.
workflow-definitions.guide.legend.delete.title = Delete
workflow-definitions.guide.legend.delete.text = Asks for confirmation first. A definition used by a workflow template is kept.
workflow-definitions.guide.steps.title = Set up a definition
workflow-definitions.guide.steps.1.title = Create it
workflow-definitions.guide.steps.1.text = Type a name in the field at the top right of the grid and press <kbd>Enter</kbd>.
workflow-definitions.guide.steps.2.title = Open it
workflow-definitions.guide.steps.2.text = Click its name. The development page opens with the definition selected.
workflow-definitions.guide.steps.3.title = Write its script
workflow-definitions.guide.steps.3.text = Type the commands in the editor, try them with <em>Run</em> and keep them with <em>Save</em>.
workflow-definitions.guide.steps.4.title = Schedule it
workflow-definitions.guide.steps.4.text = Under <em>Workflow Templates</em>, click a template to open it and drag the definition to <em>Selected workflow definitions</em>.
workflow-definitions.guide.notes.used.title = A definition in use cannot be deleted
workflow-definitions.guide.notes.used.text = Take the definition out of every workflow template that runs it, then delete it.
workflow-definitions.guide.notes.rename.title = Renaming is safe
workflow-definitions.guide.notes.rename.text = A workflow template refers to a definition by its id, so it keeps running the definition under its new name.
workflow-definitions.guide.notes.placeholders.title = Reuse a value across definitions
workflow-definitions.guide.notes.placeholders.text = Write <code>$$(NAME)</code> in a script to get the value of the placeholder <code>NAME</code>, kept under <em>Workflow Placeholders</em>.
workflow-definitions.duplicate.help = The script is copied as it was last saved. The workflow templates that run '%s' keep running it.
workflow-definitions.duplicate.open.label = Open the copy on the development page
workflow-definitions.duplicate.success.message = The workflow definition '%s' was created.

workflow-params.page.title = Workflow Parameters
workflow-params.filter.by-name.placeholder = Filter by name
workflow-params.filter.chip.name = Name: %s
workflow-params.grid.name.column = Name
workflow-params.grid.type.column = Type
workflow-params.grid.value.column = Value
workflow-params.guide.intro = A workflow parameter is a named, typed value that a workflow template hands to its workflow on every run.
workflow-params.guide.legend.value.title = Value
workflow-params.guide.legend.value.text = What the workflow receives, shown as it was typed. It is checked against the type of the parameter when you save.
workflow-params.guide.legend.edit.title = Edit
workflow-params.guide.legend.edit.text = Opens the row for editing its type and its value. The name cannot be changed.
workflow-params.guide.legend.save.title = Save
workflow-params.guide.legend.save.text = Keeps the changes of the open row. <kbd>Enter</kbd> does the same from either field.
workflow-params.guide.legend.cancel.title = Cancel
workflow-params.guide.legend.cancel.text = Closes the row and drops what was typed.
workflow-params.guide.legend.delete.title = Delete
workflow-params.guide.legend.delete.text = Asks for confirmation first.
workflow-params.guide.steps.title = Add a parameter
workflow-params.guide.steps.1.title = Name it
workflow-params.guide.steps.1.text = Type a name in the field at the top right of the grid and press <kbd>Enter</kbd>. Letters, digits, <code>_</code> and <code>.</code> are allowed.
workflow-params.guide.steps.2.title = Give it a type and a value
workflow-params.guide.steps.2.text = The new row opens for editing, as an empty <em>String</em>. Choose the type, type the value and press <kbd>Enter</kbd>.
workflow-params.guide.steps.3.title = Hand it to a template
workflow-params.guide.steps.3.text = Under <em>Workflow Templates</em>, click a template to open it and drag the parameter to <em>Selected workflow parameters</em>.
workflow-params.guide.notes.formats.title = How a value is written
workflow-params.guide.notes.formats.text = A date is written as <code>yyyy-MM-dd</code> and a time as <code>HH:mm</code>. The options of a select are separated by commas, and the workflow receives them as a list.
workflow-params.guide.notes.template.title = A parameter for one template only
workflow-params.guide.notes.template.text = End the name with the id of a template, like <code>timeout.42</code>: template #42 hands it to the workflow as <code>timeout</code>.
workflow-params.guide.notes.debug.title = Debugging a run
workflow-params.guide.notes.debug.text = A <em>Boolean</em> parameter named <code>debug</code>, set to <code>true</code>, makes a run print the resolved type and value of every command parameter.

