users.guide.intro = Who can sign in to the application, and what each of them is allowed to do.
users.guide.legend.active.title = Active
users.guide.legend.active.text = Whether the user can sign in and use their API tokens. Unticking it shuts the user out and can be taken back: the runs they started keep their name.
users.guide.legend.admin.title = Admin
users.guide.legend.admin.text = An admin writes workflow definitions and manages templates, parameters, placeholders, settings and users. The other users look at the runs, the templates and the definitions, and can run a template.
users.guide.legend.temporary.title = Temporary password
users.guide.legend.temporary.text = The user still has the password they were given, and is asked for one of their own the next time they sign in. Until they choose it, they see nothing but their profile.
users.guide.legend.chosen.title = Chosen password
users.guide.legend.chosen.text = The user chose their password themselves. Nobody else can read it.
users.guide.legend.reset.title = Reset password
users.guide.legend.reset.text = For a user who lost their password. Asks for confirmation first, then shows a new temporary password, once.
users.guide.legend.delete.title = Delete user
users.guide.legend.delete.text = Deletes the user and their API tokens for good, after a confirmation. The runs they started stay and are shown as started by a <em>Deleted user</em>; their name can be given to a new user, who does not get these runs.
users.guide.steps.title = Add a user
users.guide.steps.1.title = Name them
users.guide.steps.1.text = Type a username in the field at the top right of the grid and press <kbd>Enter</kbd>. It takes 3 to 32 letters, digits, <code>.</code>, <code>_</code> or <code>-</code>, and cannot be changed afterwards.
users.guide.steps.2.title = Hand over the password
users.guide.steps.2.text = A dialog shows the temporary password of the new user. Copy it and give it to them: it is shown only this once.
users.guide.steps.3.title = Decide what they may do
users.guide.steps.3.text = A new user is active and not an admin. Tick <em>Admin</em> to let them change things too.
users.guide.notes.own.title = Your own row is locked
users.guide.notes.own.text = Nobody can disable or delete themselves or give up their own admin role here, so there is always an admin left. Your password is changed from your profile, under your avatar at the top right.
users.guide.notes.sessions.title = A change ends the sessions of the user
users.guide.notes.sessions.text = A user who is disabled, whose role changes or whose password is reset is signed out the next time they open a page, and signs in again with what they have now.
users.guide.notes.token.title = API tokens belong to their user
users.guide.notes.token.text = A user creates the tokens they call the REST API with on their profile, and revokes them there. Nobody else can see or revoke them, and they stop working while the user is disabled.

