workflow-pipeline.intro.one = <strong>%s</strong> runs <strong>%s</strong>.
workflow-pipeline.intro.many = <strong>%s</strong> runs <strong>%s</strong>, one after another. If one fails, the ones after it are skipped.
workflow-pipeline.intro.finally.one = <strong>%s</strong> always runs at the end.
workflow-pipeline.intro.finally.many = <strong>%s</strong> always run at the end.
workflow-pipeline.command = command
