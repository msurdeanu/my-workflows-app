libs.grid.status.column = Status
libs.grid.status.ok = loaded
libs.grid.status.nok = not loaded
libs.guide.intro = The Java libraries (JAR files) which extend what the java and groovy commands of a workflow can use.
libs.guide.legend.path.title = Library path
libs.guide.legend.path.text = Where the JAR file is kept on the server. Click it to download the file.
libs.guide.legend.loaded.title = Loaded
libs.guide.legend.loaded.text = The classes of the library can be used by workflows.
libs.guide.legend.not-loaded.title = Not loaded
libs.guide.legend.not-loaded.text = The file was found, but it could not be loaded. The application log says why.
libs.guide.legend.upload.title = Upload
libs.guide.legend.upload.text = In the header. Sends a <code>.jar</code> file to the libraries directory of the server.
libs.guide.steps.title = Add a library
libs.guide.steps.1.title = Upload it
libs.guide.steps.1.text = Click the upload button in the header and choose a <code>.jar</code> file, one at a time.
libs.guide.steps.2.title = Have it loaded
libs.guide.steps.2.text = Libraries are loaded when the application starts, so the new one is listed after a restart - or right after the upload, with <code>reload-after-upload: true</code> in the application config.
libs.guide.steps.3.title = Use it
libs.guide.steps.3.text = Call its classes from the script of a <code>java</code> or <code>groovy</code> command.
libs.guide.notes.directory.title = Where libraries are kept
libs.guide.notes.directory.text = Every <code>.jar</code> file of the directory named by <code>my-workflows.config.library.base-directory</code> is a library, the ones copied there by hand included.
libs.guide.notes.replace.title = The same name replaces the file
libs.guide.notes.replace.text = A file uploaded under the name of a library that is already there overwrites it.
libs.guide.notes.remove.title = Removing a library
libs.guide.notes.remove.text = A library cannot be removed from this page: delete its file from the directory, then restart the application.

