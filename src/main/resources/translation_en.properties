workflow-pipeline.command.sshShell.label = SSH shell
workflow-pipeline.command.sshShell.text = Runs commands in a shell over SSH.
workflow-pipeline.command.sshShell.detail = Runs commands in a shell over SSH on
workflow-pipeline.command.waitUntilSubPasses.label = Wait until
workflow-pipeline.command.waitUntilSubPasses.text = Repeats the commands below until they pass.
workflow-pipeline.command.waitUntilSubPasses.detail = Repeats the commands below until they pass. Rounds at most:
workflow-development.in-progress.command-message = %s done so far.
workflow-development.auto-complete.workflow-keyword = workflow keyword
workflow-development.auto-complete.command-class = command class
workflow-development.auto-complete.command-input = command input
workflow-development.clipboard.message = The link was copied successfully to your clipboard.
workflow-development.copy-id.button.tooltip = Copy workflow id
workflow-development.copy-id.message = The workflow id was copied successfully to your clipboard.
workflow-development.script-editor.lens.java = ✎ Open in Java editor
workflow-development.script-editor.lens.groovy = ✎ Open in Groovy editor
workflow-development.script-editor.not-found.message = Place the cursor inside a java.script or groovy.script input to edit its script. The workflow definition must be a valid YAML document.
workflow-development.script-editor.not-saved.message = The script could not be written back into the workflow definition. Your changes are still in the script editor.
workflow-development.guide.intro = Write the script of a workflow definition, run it with the parameters you choose and see what it prints.
workflow-development.guide.legend.title = What you see on this page
workflow-development.guide.legend.unsaved.title = Unsaved changes
workflow-development.guide.legend.unsaved.text = In the header while the editor differs from the saved definition. Shown to an admin, once a definition is chosen.
workflow-development.guide.legend.status.title = Run status
workflow-development.guide.legend.status.text = Above the editor once a run was started: yellow while the workflow runs, green when it passed, red when it failed or when the script is not a valid workflow. Its button copies the id of the run.
workflow-development.guide.legend.lens.title = Script editor
workflow-development.guide.legend.lens.text = Above every <code>java.script</code> and <code>groovy.script</code> input. Opens the script in an editor of its own, with Java or Groovy highlighting.
workflow-development.guide.legend.run.title = Run
workflow-development.guide.legend.run.text = Runs the script as it is in the editor, saved or not, with the parameters listed under <em>Workflow Parameters</em>.
workflow-development.guide.legend.save.title = Save
workflow-development.guide.legend.save.text = Writes the script into the chosen definition. Available only while there are unsaved changes.
workflow-development.guide.legend.share.title = Share
workflow-development.guide.legend.share.text = Opens a dialog with a link to the chosen definition. The link can carry the parameters and can be made read-only.
workflow-development.guide.steps.title = Develop a workflow
workflow-development.guide.steps.1.title = Choose a definition
workflow-development.guide.steps.1.text = Pick it from the list in the header and its script opens in the editor. Definitions are created under <em>Workflow Definitions</em>.
workflow-development.guide.steps.2.title = Write the script
workflow-development.guide.steps.2.text = A workflow is a YAML document that lists its commands. The editor completes keywords, command classes and inputs as you type; type <kbd>input</kbd>, <kbd>assert</kbd> or <kbd>output</kbd> for a snippet.
workflow-development.guide.steps.3.title = Add the parameters
workflow-development.guide.steps.3.text = Under <em>Workflow Parameters</em>, type a name in the field at the top right of the grid and press <kbd>Enter</kbd>, then choose the type and the value.
workflow-development.guide.steps.4.title = Run it
workflow-development.guide.steps.4.text = Click <em>Run</em>. The status above the editor follows the run, and <em>Workflow Prints</em> lists every value it printed.
workflow-development.guide.steps.5.title = Save and share
workflow-development.guide.steps.5.text = <em>Save</em> keeps the script in the definition, for the templates that run it. <em>Share</em> hands the definition to somebody else as a link.
workflow-development.guide.notes.shortcuts.title = Keyboard shortcuts
workflow-development.guide.notes.shortcuts.text = Reformatting and the script editor need the cursor in the editor. More shortcuts are named, one at a time, under the editor.
workflow-development.guide.notes.shortcuts.focus = focus the editor
workflow-development.guide.notes.shortcuts.run = run
workflow-development.guide.notes.shortcuts.save = save
workflow-development.guide.notes.shortcuts.share = share
workflow-development.guide.notes.shortcuts.reformat = reformat
workflow-development.guide.notes.shortcuts.script = script editor
workflow-development.guide.notes.read-only.title = Read-only links
workflow-development.guide.notes.read-only.text = Whoever opens a read-only link can run the workflow, but can change neither its definition nor its parameters. Instead of the editor, the link shows the pipeline of the workflow: its commands in the order they run, each with a few words on what it does, and - once a run was started - how far the run got. The definition itself is not shown.
workflow-development.guide.notes.runs.title = Where the runs go
workflow-development.guide.notes.runs.text = A run started here is listed under <em>Workflow Runs</em>, without a template. If it fails, you can replay it from there.

